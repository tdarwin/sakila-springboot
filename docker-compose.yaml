services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    hostname: otel-collector
    restart: always
    environment:
      HONEYCOMB_API_KEY: "hcaik_01j6j4qfxf4q49net4hphdd6252cbas11xj2h5d64zvf7ppqhrw61ncb8m"
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./collector_config/otelcol-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - honeycomb

  app:
    build: .
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=sakila-app-1
    ports:
      - "8080:8080"
      - "1099:1099"
    volumes:
      - ./agent_config/jmx-rules.yaml:/jmx-rules.yaml
    depends_on:
      - db
      - otel-collector
    networks:
      - honeycomb

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - honeycomb

  db-setup:
    image: postgres
    depends_on:
      - db
    environment:
      PGPASSWORD: admin
    volumes:
      - ./db_setup:/db_setup
    entrypoint:
      - /usr/bin/bash
      - -c
      - |
        sleep 5
        psql -h db -U postgres -c 'create database sakila;'
        psql -h db -U postgres -d sakila -f /db_setup/postgres-sakila-schema.sql
        psql -h db -U postgres -d sakila -f /db_setup/postgres-sakila-insert-data.sql
    networks:
      - honeycomb
  
  adminer:
    image: adminer
    restart: always
    ports:
      - 8888:8080
    networks:
      - honeycomb

volumes:
  pgdata:

networks:
  honeycomb:
    driver: bridge