spring.application.name=sakila
# Database Connection Configuration
spring.datasource.url=jdbc:postgresql://db:5432/sakila
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JMX Configuration
spring.jmx.enabled=true
spring.jmx.default-domain=sakila

# Management and Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,jmx
management.endpoints.jmx.exposure.include=*
management.endpoint.health.show-details=always

# JMX Remote Access Configuration (additional Spring Boot settings)
management.server.port=8080
management.endpoints.web.base-path=/actuator
